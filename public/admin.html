<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração - Gustavo Mattia Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Gustavo Mattia Store</h1>

        <nav>
            <a href="/">Início</a>
            <a href="/produtos.html">Produtos</a>
            <a href="/cliente.html">Clientes</a>
            <a href="/admin.html">Administração</a>
        </nav>

    </header>

    <main>

        <section class="form-container">

            <h2>Cadastrar produto</h2>

            <form id="produtoForm">

                <label>
                    Marca
                    <input
                        type="text"
                        id="marca"
                        name="marca"
                        required
                    >
                </label>

                <label>
                    Modelo
                    <input
                        type="text"
                        id="modelo"
                        name="modelo"
                        required
                    >
                </label>

                <label>
                    Preço
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        step="0.01"
                        min="0.01"
                        required
                    >
                </label>

                <label>
                    Quantidade disponível
                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="0"
                        required
                    >
                </label>

                <label>
                    Descrição
                    <textarea
                        id="descricao"
                        name="descricao"
                    ></textarea>
                </label>

                <label>
                    Foto do produto
                    <input
                        type="file"
                        id="imagem"
                        name="imagem"
                        accept="image/*"
                    >
                </label>

                <button type="submit" class="btn">
                    Cadastrar produto
                </button>

            </form>

            <div id="mensagem"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
